name: Weekly flight search

on:
  schedule:
    - cron: "0 7 * * 5"  # Fridays 08:00 Brussels (winter time)
  workflow_dispatch:      # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python search.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Save report
        run: |
          git config user.name "flight-agent"
          git config user.email "flight-agent@users.noreply.github.com"
          git add reports prices.csv
          git commit -m "Flight report $(date +%F)" || echo "No changes"
          git push
